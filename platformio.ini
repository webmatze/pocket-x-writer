; PocketX Writer — distraction-free book-writing firmware for the Xteink X4 Pro
;
; Envs:
;   x4pro  — the real device (ESP32-S3, 16MB flash / 8MB PSRAM, 800x480 EPD)
;   native — host unit tests for the portable editor core (no Arduino headers)
;
; The simulator env is added in M2 once the SDL2 host is vendored.

[platformio]
default_envs = x4pro

; ---------------------------------------------------------------------------
; Shared ESP32-S3 configuration. Mirrors freeink-sdk/platformio.sample.ini
; [base], which is the authoritative reference (its README's minimal example
; disagrees and is illustrative only).
; ---------------------------------------------------------------------------
[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x).
; Pure `arduino` framework — NOT `arduino, espidf`. The mixed mode is what the
; MicroSlate "no Mac ARM" warning refers to, and it would break the simulator.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++2a
  ; Project include/ must be on the path for LIBRARY builds too, not just src/:
  ; the SDK's FrontlightManager includes our consumer-supplied <Logging.h>.
  -I include
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the controller's RAM holds the previous frame (48 KB).
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1

board_build.flash_mode = dio
board_build.flash_size = 16MB
; Must match the device's real table (read from its own backup). Without this
; PlatformIO uses a default with 6.25 MB app slots and would size-check against
; the wrong number -- and any accidental `-t upload` would rewrite the table and
; destroy whatever is in the other OTA slot.
board_build.partitions = partitions.csv

lib_deps =
  BoardConfig=symlink://vendor/freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://vendor/freeink-sdk/libs/hardware/XteinkDetect
  EInkDisplay=symlink://vendor/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://vendor/freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://vendor/freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://vendor/freeink-sdk/libs/hardware/SDCardManager
  FreeInkUI=symlink://vendor/freeink-sdk/libs/ui/FreeInkUI
  FrontlightManager=symlink://vendor/freeink-sdk/libs/hardware/FrontlightManager
  PowerManager=symlink://vendor/freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://vendor/freeink-sdk/libs/hardware/Rtc
  ; BLE HID host — the SDK ships one, so we do not write our own.
  BleKeyboardHost=symlink://vendor/freeink-sdk/libs/network/BleKeyboardHost
  UsbMassStorage=symlink://vendor/freeink-sdk/libs/hardware/UsbMassStorage
  h2zero/NimBLE-Arduino@^2.3.8

; ---------------------------------------------------------------------------
; Xteink X4 Pro — ESP32-S3, 800x480 EPD (SSD1677 or UC8179, picked at boot),
; GT911 touch, dual warm/cold frontlight, native SDMMC.
; ---------------------------------------------------------------------------
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8   ; 16 MB flash + 8 MB octal PSRAM
board_build.mcu = esp32s3

build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  ; REQUIRED for the SD path on this device. docs/xteink-x4pro-support.md states
  ; twice that [env:x4pro] defines this, but the SDK's own sample.ini does NOT
  ; (verified: 0 occurrences). Without it the SdFat FsVolume mount fails.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; USB Mass Storage: expose the SD card to a Mac over the same USB-C cable.
  ; CrossPoint ships this on the X4 Pro alongside ARDUINO_USB_MODE=1, so the
  ; two are not the either/or I assumed when planning M8.
  -DFREEINK_CAP_USB_MSC=1
  ; --- BLE HID host (keyboard) ---
  -DFREEINK_CAP_BLE_HID_HOST=1
  ; Bring-up: show anonymous advertisers too. A keyboard that has not sent its
  ; name yet would otherwise be invisible in the scan list.
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=1
  ; FREEINK_BLE_HID_REPORT_DEBUG=1 dumps every raw HID report. Turn it on to read
  ; a keyboard's actual report layout rather than infer it -- that is how the
  ; K2 HE's constant 0x39 byte was found.
  ; FREEINK_BLE_HID_SCAN_DEBUG=1 dumps every advertisement. Useful once, but it
  ; floods USB CDC badly enough to corrupt its own output -- turn it on only to
  ; chase a specific device, never for normal bring-up.
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  ; NOTE: the SDK doc also suggests CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0,
  ; ROLE_BROADCASTER=0, MAX_CONNECTIONS=1 and MAX_BONDS=4 to shrink the BLE
  ; footprint. They are omitted on purpose: the prebuilt Arduino sdkconfig.h
  ; already defines them (as 1/1/3/3) and overriding from the command line only
  ; changes the sources we compile, not the precompiled stack -- a
  ; MAX_CONNECTIONS mismatch there is a struct-size hazard, not a warning we can
  ; ignore. Revisit in M4 with a proper sdkconfig override if the footprint matters.

; NOTE: -DFREEINK_FB_PSRAM is deliberately NOT set. The framebuffer is 48 KB
; (800x480x1bpp) and fits SRAM easily; PSRAM-sourced SPI transfers are slower on
; the S3. The flag exists for grayscale/dual-plane, not speed. M3 measures both.

; ---------------------------------------------------------------------------
; Host unit tests for the portable editor core.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  -std=gnu++2a
  -DPOCKETX_HOST_BUILD=1
  -I src
  -I include
  ; FreeInkUIFont.h defines the BitmapFont layout the generated fonts use. It
  ; includes only <stdint.h>, so the portable core can use it on the host too.
  -I vendor/freeink-sdk/libs/ui/FreeInkUI/include
; Compile the portable core into the test binary. Without test_build_src the
; test links against nothing and every core symbol comes up undefined.
build_src_filter = +<core/>
test_build_src = yes
test_framework = unity
